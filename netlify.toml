[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[images]
  remote_images = ['https://zansdbambqukamkxvwos\.supabase\.co/storage/v1/object/public/lowprofile\.dreams/.*']
