<body>
  <div id="root"></div>
  <!-- Hidden static form ensures Netlify Forms can detect fields during the Vite build. -->
  <form name="lojistas" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="lojistas" />
    <input name="bot-field" />
    <input name="cidade" />
    <input name="loja" />
    <input name="marcas" />
    <input name="cnpj" />
    <input name="contato" />
    <input name="interesse" />
    <input name="consentimento" />
  </form>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
